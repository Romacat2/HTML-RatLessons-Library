<!DOCTYPE html>
<html lang="uk">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title data-i18n="library.spelling.title">Встав літеру — Бібліотека Roma's Rat Games</title>
		<link rel="icon" href="icons/favicon.png">
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
		<link rel="stylesheet" href="../style.css">
		<meta name="theme-color" content="#121212">
		<script src="../locales/uk.js"></script>
		<script src="../locales/en.js"></script>
		<script src="../locales/de.js"></script>
		<script src="../i18n.js"></script>
		<script>I18N.detectAndLoad();</script>
		<script src="../nav.js"></script>
		<style>
			.hero {
				margin-top: -1rem;
				max-width: 100%;
			}

			.page-title {
				font-size: clamp(1.8rem, 5vw, 2.4rem);
				margin: 0;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<nav>
			<a href="../index.html" class="csharp-btn" style="background:#888" data-i18n="library.spelling.backHome">← Бібліотека</a>
			<app-nav></app-nav>
		</nav>
		<div class="main-content">
			<div class="hero">
				<h1 class="page-title" data-i18n="library.spelling.pageTitle">✏️ Встав літеру</h1>
				<p class="hero-text" style="opacity: 0.7; font-weight: 400;" data-i18n="library.spelling.subtitle">
					Готові набори слів для вправ на орфографію. Імпортуй у застосунок файлом або посиланням.
				</p>

				<div class="library-grid" id="libraryGrid"></div>
				<p class="library-empty" id="libraryEmpty" style="display:none;" data-i18n="library.spelling.empty">
					Поки що тут порожньо — завітай пізніше.
				</p>
			</div>
		</div>

		<script src="../lib.js"></script>
		<script>
			I18N.init();

			const gridEl = document.getElementById("libraryGrid");
			const emptyEl = document.getElementById("libraryEmpty");

			function renderPreview() {
				// Картинок у spelling-уроках немає за дизайном — завжди заглушка.
				return `<div class="lesson-card-preview-fallback">✏️</div>`;
			}

			const gridOptions = {
				baseDir: "data",
				gridEl,
				emptyEl,
				renderPreview,
				onError: () => {
					emptyEl.textContent = I18N.t("library.spelling.loadError");
					emptyEl.style.display = "block";
				},
			};

			LibraryShared.renderLibraryGrid(gridOptions);
			LibraryShared.watchLanguageChanges(gridOptions);
		</script>
	</body>
</html>
